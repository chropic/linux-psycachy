name: Ubuntu 26.10 kernel build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container: ubuntu:26.10
    steps:
      - name: Install checkout prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: bash tools/ubuntu-26.10.sh
      - name: Static and policy tests
        run: bash tests/static-check.sh
      - name: Lint target entry points
        run: |
          apt-get install -y --no-install-recommends shellcheck
          shellcheck -x build.sh config/source-pin.sh targets/sp121-arm64/prepare.sh targets/sp121-arm64/build.sh \
            targets/sp121-arm64/installer/install-grub-fallback-guard.sh \
            targets/sp121-arm64/installer/install-boot-sync.sh targets/sp121-arm64/installer/install-fallback-target.sh \
            targets/sp121-arm64/installer/inspect-install-target.sh \
            targets/sp121-arm64/system/usr-local-sbin/sp12-sync-boot targets/sp121-arm64/system/usr-local-sbin/sp12-esp-space \
            targets/sp121-arm64/system/usr-local-sbin/sp12-grub-multi-install-guard \
            targets/sp121-arm64/system/etc/kernel/postinst.d/zzzz-sp12-sync \
            targets/sp121-arm64/system/etc/initramfs/post-update.d/zzzz-sp12-sync \
            tests/static-check.sh
      - name: Build and package
        run: bash build.sh --jobs 2 --output-dir output/ci
      - name: Reject invalid source, signature, and patch inputs
        run: PSYCACHY_TEST_ARCHIVE="$HOME/.cache/psycachy/cachyos-7.3.1-1.tar.gz" bash tests/builder-negative.sh
      - name: Test local Secure Boot signing
        run: |
          apt-get install -y --no-install-recommends mokutil sbsigntool
          PSYCACHY_DISPOSABLE_TEST=1 bash tests/signing-integration.sh
      - name: Install packages and build NVIDIA DKMS in disposable container
        run: PSYCACHY_DISPOSABLE_TEST=1 bash tests/nvidia-dkms-integration.sh output/ci
      - name: Upload CPU-specific build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psycachy-ubuntu2610-ci-native
          path: output/ci/
          if-no-files-found: warn
